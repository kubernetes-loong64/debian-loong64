name: check-deb-version

on:
  schedule:
    - cron: '17 18 * * *'  # 每天北京时间凌晨 2:17 (UTC+8), UTC 18:17
  push:
    branches:
      - main
    paths:
      - .github/workflows/check-deb-version.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/check-deb-version.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deb:
          - name: linux-image
            version: 7.2.6
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Pull Debian image
        run: docker pull --platform linux/loong64 lcr.loongnix.cn/debian:14
      - name: Debug debian.sources
        run: docker run --rm --platform linux/loong64 lcr.loongnix.cn/debian:14 cat /etc/apt/sources.list.d/debian.sources
      - name: Get available ${{ matrix.deb.name }} versions
        id: get-versions
        run: |
          VERSIONS=$(docker run --rm --platform linux/loong64 lcr.loongnix.cn/debian:14 \
            bash -c "
              rm -rf /etc/apt/sources.list.d/debian.sources
              echo '' > /etc/apt/sources.list
              echo 'deb http://deb.debian.org/debian/ forky main' >> /etc/apt/sources.list
              echo 'deb http://deb.debian.org/debian/ forky-updates main' >> /etc/apt/sources.list
              echo 'deb http://deb.debian.org/debian-security forky-security main' >> /etc/apt/sources.list
              apt-get update -qq
              apt-cache search ${{ matrix.deb.name }} \
                | grep '^${{ matrix.deb.name }}' \
                | grep -v 'debug' \
                | grep -v '${{ matrix.deb.name }}-loong64' \
                | awk '{print \$4}'
            ")
          echo "Found versions: $VERSIONS"
          echo "versions=$(echo "$VERSIONS" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

          # Compare each version against the expected version
          EXPECTED="${{ matrix.deb.version }}"
          HAS_NEWER="false"
          NEWER_VERSIONS=""
          for v in $VERSIONS; do
            if dpkg --compare-versions "$v" gt "$EXPECTED"; then
              HAS_NEWER="true"
              NEWER_VERSIONS="$NEWER_VERSIONS $v"
            fi
          done
          echo "has_newer=$HAS_NEWER" >> "$GITHUB_OUTPUT"
          echo "newer_versions=$(echo "$NEWER_VERSIONS" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Notify WeChat Work if new version available
        if: steps.get-versions.outputs.has_newer == 'true'
        run: |
          python .github/scripts/notify-wechat.py \
            --webhook-url "${{ secrets.WECHAT_WEBHOOK_URL }}" \
            --deb-name "${{ matrix.deb.name }}" \
            --expected-version "${{ matrix.deb.version }}" \
            --newer-versions "${{ steps.get-versions.outputs.newer_versions }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
