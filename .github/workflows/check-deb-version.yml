name: check-deb-version

on:
  schedule:
    - cron: '17 18 * * *'  # 每天北京时间凌晨 2:17 (UTC+8), UTC 18:17
  push:
    branches:
      - main
    paths:
      - .github/workflows/check-deb-version.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/check-deb-version.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deb:
          - name: linux-image
            version: 7.0.13
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Pull Debian image
        run: docker pull --platform linux/loong64 lcr.loongnix.cn/debian:14
      - name: Get available ${{ matrix.deb.name }} versions
        id: get-versions
        run: |
          VERSIONS=$(docker run --rm --platform linux/loong64 lcr.loongnix.cn/debian:14 \
            bash -c "rm -rf /etc/apt/sources.list.d/debian.sources && echo '' > /etc/apt/sources.list && echo 'deb http://deb.debian.org/debian/ forky main' >> /etc/apt/sources.list && apt-get update -qq && apt-cache search ${{ matrix.deb.name }} | grep '^${{ matrix.deb.name }}' | grep -v 'debug' | grep -v '${{ matrix.deb.name }}-loong64' | awk '{print \$4}'")
          echo "Found versions: $VERSIONS"
          echo "versions=$(echo "$VERSIONS" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

          # Get the candidate version of the package for comparison
          CANDIDATE_VERSION=$(docker run --rm --platform linux/loong64 lcr.loongnix.cn/debian:14 \
            bash -c "rm -rf /etc/apt/sources.list.d/debian.sources && echo '' > /etc/apt/sources.list && echo 'deb http://deb.debian.org/debian/ forky main' >> /etc/apt/sources.list && apt-get update -qq && apt-cache policy ${{ matrix.deb.name }} 2>/dev/null | grep 'Candidate:' | awk '{print \$2}'")
          echo "Candidate version: $CANDIDATE_VERSION"

          EXPECTED="${{ matrix.deb.version }}"
          HAS_NEWER="false"
          if [ -n "$CANDIDATE_VERSION" ]; then
            # Use dpkg to compare Debian package versions
            if dpkg --compare-versions "$CANDIDATE_VERSION" gt "$EXPECTED"; then
              HAS_NEWER="true"
            fi
          fi
          echo "has_newer=$HAS_NEWER" >> "$GITHUB_OUTPUT"
          echo "candidate_version=$CANDIDATE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Notify WeChat Work if new version available
        if: steps.get-versions.outputs.has_newer == 'true'
        run: |
          MESSAGE="## Debian 包版本更新通知\n\n"
          MESSAGE+="> **包名**: <font color=\"comment\">${{ matrix.deb.name }}</font>\n"
          MESSAGE+="> **预期版本**: <font color=\"comment\">${{ matrix.deb.version }}</font>\n"
          MESSAGE+="> **新版本**: <font color=\"warning\">${{ steps.get-versions.outputs.candidate_version }}</font>\n\n"
          MESSAGE+="请及时更新 [GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          curl -s -X POST "${{ secrets.WECHAT_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg content "$MESSAGE" \
              '{msgtype: "markdown", markdown: {content: $content}}')"

          echo "WeChat Work notification sent."
